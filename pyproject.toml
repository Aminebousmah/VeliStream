[project]
name = "velistream"
version = "0.1.0"
description = "Pipeline temps réel sur les stations Vélib' : Redpanda, ClickHouse, dbt, Dagster et Grafana."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "confluent-kafka>=2.4",
    "clickhouse-connect>=0.7",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dbt-clickhouse>=1.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["producer", "orchestration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
